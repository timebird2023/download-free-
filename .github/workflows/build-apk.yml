name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter Android Project
        run: flutter create --no-pub --project-name pro_downloader --org com.boykta --platforms=android .

      - name: Safely Inject Manifest and PiP Data
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          
          path = 'android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          root = tree.getroot()
          
          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.MANAGE_EXTERNAL_STORAGE',
              'com.google.android.gms.permission.AD_ID',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.USE_BIOMETRIC',
              'android.permission.USE_FINGERPRINT',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_DATA_SYNC'
          ]
          for p in perms:
              e = ET.Element('uses-permission')
              e.set('{http://schemas.android.com/apk/res/android}name', p)
              root.insert(0, e)
              
          app = root.find('application')
          if app is not None:
              app.set('{http://schemas.android.com/apk/res/android}largeHeap', 'true')
              app.set('{http://schemas.android.com/apk/res/android}requestLegacyExternalStorage', 'true')

              for act in app.findall('activity'):
                  if '{http://schemas.android.com/apk/res/android}taskAffinity' in act.attrib:
                      del act.attrib['{http://schemas.android.com/apk/res/android}taskAffinity']
                  act.set('{http://schemas.android.com/apk/res/android}supportsPictureInPicture', 'true')
                  act.set('{http://schemas.android.com/apk/res/android}configChanges', 'orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode')

                  name = act.attrib.get('{http://schemas.android.com/apk/res/android}name', '')
                  if 'MainActivity' in name or name == '.MainActivity':
                      inf = ET.Element('intent-filter')
                      act_elem = ET.Element('action')
                      act_elem.set('{http://schemas.android.com/apk/res/android}name', 'android.intent.action.SEND')
                      cat_elem = ET.Element('category')
                      cat_elem.set('{http://schemas.android.com/apk/res/android}name', 'android.intent.category.DEFAULT')
                      data_elem = ET.Element('data')
                      data_elem.set('{http://schemas.android.com/apk/res/android}mimeType', 'text/plain')
                      inf.append(act_elem)
                      inf.append(cat_elem)
                      inf.append(data_elem)
                      act.append(inf)
              
          tree.write(path, encoding='utf-8', xml_declaration=True)
          "

      - name: Setup FlutterFragmentActivity, PiP and Native MediaMuxer Channels
        run: |
          python3 -c '
          import os
          dir_path = "android/app/src/main/java/com/boykta/pro_downloader"
          os.makedirs(dir_path, exist_ok=True)
          java_code = """package com.boykta.pro_downloader;

          import android.app.PictureInPictureParams;
          import android.media.MediaCodec;
          import android.media.MediaExtractor;
          import android.media.MediaFormat;
          import android.media.MediaMuxer;
          import android.media.MediaScannerConnection;
          import android.os.Build;
          import android.util.Log;
          import android.util.Rational;
          import androidx.annotation.NonNull;
          import io.flutter.embedding.android.FlutterFragmentActivity;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.plugin.common.MethodChannel;
          import io.flutter.plugins.GeneratedPluginRegistrant;
          import java.io.File;
          import java.nio.ByteBuffer;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends FlutterFragmentActivity {
              private static final String PIP_CHANNEL = "com.boykta.app/pip";
              private static final String MUXER_CHANNEL = "com.boykta.app/media_muxer";
              private static final String SHARE_CHANNEL = "com.boykta.app/share_intent";
              private static final String TAG = "MainActivity";
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              private MethodChannel shareMethodChannel = null;
              private String pendingSharedText = null;
              private boolean isVideoPlaying = false;

              @Override
              protected void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handleIntent(getIntent());
              }

              @Override
              public void onNewIntent(@NonNull android.content.Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              private void handleIntent(android.content.Intent intent) {
                  if (intent != null && android.content.Intent.ACTION_SEND.equals(intent.getAction())) {
                      String type = intent.getType();
                      if (type != null && type.startsWith("text/")) {
                          String sharedText = intent.getStringExtra(android.content.Intent.EXTRA_TEXT);
                          if (sharedText != null && !sharedText.trim().isEmpty()) {
                              pendingSharedText = sharedText.trim();
                              if (shareMethodChannel != null) {
                                  runOnUiThread(() -> shareMethodChannel.invokeMethod("onLinkReceived", pendingSharedText));
                              }
                          }
                      }
                  }
              }

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (isVideoPlaying && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          PictureInPictureParams params = new PictureInPictureParams.Builder()
                              .setAspectRatio(new Rational(16, 9))
                              .build();
                          enterPictureInPictureMode(params);
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void configureFlutterEngine(@NonNull FlutterEngine flutterEngine) {
                  super.configureFlutterEngine(flutterEngine);
                  try {
                      GeneratedPluginRegistrant.registerWith(flutterEngine);
                  } catch (Exception e) {
                      Log.e(TAG, "Plugin registration error: " + e.getMessage());
                  }

                  shareMethodChannel = new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), SHARE_CHANNEL);
                  shareMethodChannel.setMethodCallHandler((call, result) -> {
                      if ("getInitialSharedText".equals(call.method)) {
                          result.success(pendingSharedText);
                          pendingSharedText = null;
                      } else {
                          result.notImplemented();
                      }
                  });

                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), PIP_CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          if ("enterPip".equals(call.method)) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  try {
                                      PictureInPictureParams params = new PictureInPictureParams.Builder()
                                          .setAspectRatio(new Rational(16, 9))
                                          .build();
                                      enterPictureInPictureMode(params);
                                      result.success(true);
                                  } catch (Exception e) {
                                      result.error("PIP_ERROR", e.getMessage(), null);
                                  }
                              } else {
                                  result.error("NOT_SUPPORTED", "PiP requires Android Oreo (API 26) or higher", null);
                              }
                          } else if ("setPlaying".equals(call.method)) {
                              Boolean playing = call.argument("isPlaying");
                              isVideoPlaying = (playing != null && playing);
                              if (Build.VERSION.SDK_INT >= 31) {
                                  try {
                                      PictureInPictureParams params = new PictureInPictureParams.Builder()
                                          .setAspectRatio(new Rational(16, 9))
                                          .setAutoEnterEnabled(isVideoPlaying)
                                          .build();
                                      setPictureInPictureParams(params);
                                  } catch (Exception ignored) {}
                              }
                              result.success(true);
                          } else {
                              result.notImplemented();
                          }
                      });

                  new MethodChannel(flutterEngine.getDartExecutor().getBinaryMessenger(), MUXER_CHANNEL)
                      .setMethodCallHandler((call, result) -> {
                          if ("muxAudioVideo".equals(call.method)) {
                              final String videoPath = call.argument("videoPath");
                              final String audioPath = call.argument("audioPath");
                              final String outputPath = call.argument("outputPath");
                              if (videoPath == null || audioPath == null || outputPath == null) {
                                  result.error("INVALID_ARGS", "Paths cannot be null", null);
                                  return;
                              }
                              executor.execute(() -> {
                                  boolean success = muxNativeAudioVideo(videoPath, audioPath, outputPath);
                                  runOnUiThread(() -> result.success(success));
                              });
                          } else if ("trimAudio".equals(call.method)) {
                              final String inputPath = call.argument("inputPath");
                              final String outputPath = call.argument("outputPath");
                              final Number startMsNum = call.argument("startMs");
                              final Number endMsNum = call.argument("endMs");
                              if (inputPath == null || outputPath == null) {
                                  result.error("INVALID_ARGS", "Paths cannot be null", null);
                                  return;
                              }
                              final long startMs = startMsNum != null ? startMsNum.longValue() : 0L;
                              final long endMs = endMsNum != null ? endMsNum.longValue() : Long.MAX_VALUE;
                              executor.execute(() -> {
                                  boolean success = trimNativeAudio(inputPath, outputPath, startMs, endMs);
                                  runOnUiThread(() -> result.success(success));
                              });
                          } else if ("extractAudio".equals(call.method)) {
                              final String videoPath = call.argument("videoPath");
                              final String outputPath = call.argument("outputPath");
                              if (videoPath == null || outputPath == null) {
                                  result.error("INVALID_ARGS", "Paths cannot be null", null);
                                  return;
                              }
                              executor.execute(() -> {
                                  boolean success = extractNativeAudio(videoPath, outputPath);
                                  runOnUiThread(() -> result.success(success));
                              });
                          } else if ("scanMediaFile".equals(call.method)) {
                              final String filePath = call.argument("path");
                              if (filePath != null) {
                                  MediaScannerConnection.scanFile(getApplicationContext(), new String[]{filePath}, null, null);
                                  result.success(true);
                              } else {
                                  result.error("INVALID_ARGS", "Path cannot be null", null);
                              }
                          } else {
                              result.notImplemented();
                          }
                      });
              }

              private boolean muxNativeAudioVideo(String videoPath, String audioPath, String outputPath) {
                  MediaExtractor videoExtractor = new MediaExtractor();
                  MediaExtractor audioExtractor = new MediaExtractor();
                  MediaMuxer muxer = null;
                  try {
                      File vFile = new File(videoPath);
                      File aFile = new File(audioPath);
                      if (!vFile.exists() || !aFile.exists()) {
                          Log.e(TAG, "Source files do not exist: v=" + vFile.exists() + ", a=" + aFile.exists());
                          return false;
                      }
                      videoExtractor.setDataSource(videoPath);
                      audioExtractor.setDataSource(audioPath);

                      int videoSourceTrack = -1;
                      String videoMime = "";
                      for (int i = 0; i < videoExtractor.getTrackCount(); i++) {
                          MediaFormat format = videoExtractor.getTrackFormat(i);
                          String mime = format.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("video/")) {
                              videoSourceTrack = i;
                              videoMime = mime.toLowerCase();
                              break;
                          }
                      }

                      int audioSourceTrack = -1;
                      String audioMime = "";
                      for (int i = 0; i < audioExtractor.getTrackCount(); i++) {
                          MediaFormat format = audioExtractor.getTrackFormat(i);
                          String mime = format.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("audio/")) {
                              audioSourceTrack = i;
                              audioMime = mime.toLowerCase();
                              break;
                          }
                      }

                      if (videoSourceTrack == -1 || audioSourceTrack == -1) {
                          Log.e(TAG, "Tracks not found: videoTrack=" + videoSourceTrack + ", audioTrack=" + audioSourceTrack);
                          return false;
                      }

                      File outFile = new File(outputPath);
                      if (outFile.exists()) {
                          outFile.delete();
                      }

                      int outputFormat = MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4;
                      if ((videoMime.contains("webm") || videoMime.contains("vp8") || videoMime.contains("vp9") || audioMime.contains("opus") || outputPath.toLowerCase().endsWith(".webm")) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          outputFormat = MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM;
                      }

                      muxer = new MediaMuxer(outputPath, outputFormat);

                      videoExtractor.selectTrack(videoSourceTrack);
                      MediaFormat videoFormat = videoExtractor.getTrackFormat(videoSourceTrack);
                      int muxerVideoTrack = muxer.addTrack(videoFormat);

                      audioExtractor.selectTrack(audioSourceTrack);
                      MediaFormat audioFormat = audioExtractor.getTrackFormat(audioSourceTrack);
                      int muxerAudioTrack = muxer.addTrack(audioFormat);

                      muxer.start();

                      int maxBufferSize = 1024 * 1024 * 8;
                      if (videoFormat.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = videoFormat.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }
                      if (audioFormat.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = audioFormat.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }
                      ByteBuffer buffer = ByteBuffer.allocateDirect(maxBufferSize);
                      MediaCodec.BufferInfo bufferInfo = new MediaCodec.BufferInfo();

                      boolean videoDone = false;
                      boolean audioDone = false;
                      long videoStartPts = -1;
                      long audioStartPts = -1;
                      long lastVideoTime = -1;
                      long lastAudioTime = -1;
                      int videoSampleCount = 0;
                      int audioSampleCount = 0;

                      while (!videoDone || !audioDone) {
                          long vTime = videoDone ? Long.MAX_VALUE : videoExtractor.getSampleTime();
                          long aTime = audioDone ? Long.MAX_VALUE : audioExtractor.getSampleTime();

                          long normV = (vTime == Long.MAX_VALUE || videoStartPts == -1) ? vTime : Math.max(0, vTime - videoStartPts);
                          long normA = (aTime == Long.MAX_VALUE || audioStartPts == -1) ? aTime : Math.max(0, aTime - audioStartPts);

                          if (!videoDone && (audioDone || normV <= normA)) {
                              bufferInfo.offset = 0;
                              bufferInfo.size = videoExtractor.readSampleData(buffer, 0);
                              if (bufferInfo.size < 0) {
                                  videoDone = true;
                              } else {
                                  long rawSampleTime = videoExtractor.getSampleTime();
                                  if (videoStartPts == -1) {
                                      videoStartPts = rawSampleTime >= 0 ? rawSampleTime : 0;
                                  }
                                  long pts = rawSampleTime - videoStartPts;
                                  if (pts < 0) pts = 0;
                                  if (pts <= lastVideoTime) pts = lastVideoTime + 1000;
                                  lastVideoTime = pts;
                                  bufferInfo.presentationTimeUs = pts;
                                  bufferInfo.flags = videoExtractor.getSampleFlags();
                                  muxer.writeSampleData(muxerVideoTrack, buffer, bufferInfo);
                                  videoSampleCount++;
                                  videoExtractor.advance();
                              }
                          } else if (!audioDone) {
                              bufferInfo.offset = 0;
                              bufferInfo.size = audioExtractor.readSampleData(buffer, 0);
                              if (bufferInfo.size < 0) {
                                  audioDone = true;
                              } else {
                                  long rawSampleTime = audioExtractor.getSampleTime();
                                  if (audioStartPts == -1) {
                                      audioStartPts = rawSampleTime >= 0 ? rawSampleTime : 0;
                                  }
                                  long pts = rawSampleTime - audioStartPts;
                                  if (pts < 0) pts = 0;
                                  if (pts <= lastAudioTime) pts = lastAudioTime + 1000;
                                  lastAudioTime = pts;
                                  bufferInfo.presentationTimeUs = pts;
                                  bufferInfo.flags = audioExtractor.getSampleFlags();
                                  muxer.writeSampleData(muxerAudioTrack, buffer, bufferInfo);
                                  audioSampleCount++;
                                  audioExtractor.advance();
                              }
                          }
                      }

                      if (videoSampleCount > 0 && audioSampleCount > 0) {
                          muxer.stop();
                      }
                      muxer.release();
                      muxer = null;

                      File finalFile = new File(outputPath);
                      if (finalFile.exists() && finalFile.length() > 0) {
                          try {
                              MediaScannerConnection.scanFile(getApplicationContext(), new String[]{outputPath}, null, null);
                          } catch (Exception ignored) {}
                      }
                      return finalFile.exists() && finalFile.length() > 0 && videoSampleCount > 0 && audioSampleCount > 0;
                  } catch (Exception e) {
                      Log.e(TAG, "Native MediaMuxer error: " + e.getMessage(), e);
                      return false;
                  } finally {
                      try { videoExtractor.release(); } catch (Exception ignored) {}
                      try { audioExtractor.release(); } catch (Exception ignored) {}
                      if (muxer != null) {
                          try { muxer.release(); } catch (Exception ignored) {}
                      }
                  }
              }

              private boolean trimNativeAudio(String inputPath, String outputPath, long startMs, long endMs) {
                  MediaExtractor extractor = new MediaExtractor();
                  MediaMuxer muxer = null;
                  try {
                      extractor.setDataSource(inputPath);
                      int audioSourceTrack = -1;
                      MediaFormat format = null;
                      String mimeType = "";
                      for (int i = 0; i < extractor.getTrackCount(); i++) {
                          MediaFormat f = extractor.getTrackFormat(i);
                          String mime = f.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("audio/")) {
                              audioSourceTrack = i;
                              format = f;
                              mimeType = mime.toLowerCase();
                              break;
                          }
                      }
                      if (audioSourceTrack == -1 || format == null) return false;
                      extractor.selectTrack(audioSourceTrack);
                      File outFile = new File(outputPath);
                      if (outFile.exists()) outFile.delete();

                      int outFormat = MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4;
                      if ((mimeType.contains("opus") || outputPath.toLowerCase().endsWith(".webm") || outputPath.toLowerCase().endsWith(".ogg")) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          outFormat = MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM;
                      }
                      muxer = new MediaMuxer(outputPath, outFormat);
                      int audioTrackIndex = muxer.addTrack(format);
                      muxer.start();

                      long startUs = startMs * 1000L;
                      long endUs = endMs * 1000L;
                      extractor.seekTo(startUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC);

                      int maxBufferSize = 512 * 1024;
                      if (format.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = format.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }
                      ByteBuffer buffer = ByteBuffer.allocateDirect(maxBufferSize);
                      MediaCodec.BufferInfo bufferInfo = new MediaCodec.BufferInfo();
                      long firstSampleTimeUs = -1;
                      long lastSampleTimeUs = -1;
                      int sampleCount = 0;

                      while (true) {
                          bufferInfo.offset = 0;
                          bufferInfo.size = extractor.readSampleData(buffer, 0);
                          if (bufferInfo.size < 0) break;
                          long sampleTimeUs = extractor.getSampleTime();
                          if (sampleTimeUs > endUs) break;
                          if (sampleTimeUs >= startUs) {
                              if (firstSampleTimeUs == -1) {
                                  firstSampleTimeUs = sampleTimeUs >= 0 ? sampleTimeUs : 0;
                              }
                              long pts = sampleTimeUs - firstSampleTimeUs;
                              if (pts < 0) pts = 0;
                              if (pts <= lastSampleTimeUs) pts = lastSampleTimeUs + 1000;
                              lastSampleTimeUs = pts;
                              bufferInfo.presentationTimeUs = pts;
                              bufferInfo.flags = extractor.getSampleFlags();
                              muxer.writeSampleData(audioTrackIndex, buffer, bufferInfo);
                              sampleCount++;
                          }
                          extractor.advance();
                      }
                      if (sampleCount == 0) return false;
                      muxer.stop();
                      muxer.release();
                      muxer = null;
                      File finalFile = new File(outputPath);
                      return finalFile.exists() && finalFile.length() > 0;
                  } catch (Exception e) {
                      Log.e(TAG, "trimNativeAudio error: " + e.getMessage(), e);
                      return false;
                  } finally {
                      try { extractor.release(); } catch (Exception ignored) {}
                      if (muxer != null) {
                          try { muxer.release(); } catch (Exception ignored) {}
                      }
                  }
              }

              private boolean extractNativeAudio(String videoPath, String outputPath) {
                  MediaExtractor extractor = new MediaExtractor();
                  MediaMuxer muxer = null;
                  try {
                      extractor.setDataSource(videoPath);
                      int audioTrackIndex = -1;
                      MediaFormat format = null;
                      String mimeType = "";
                      for (int i = 0; i < extractor.getTrackCount(); i++) {
                          MediaFormat f = extractor.getTrackFormat(i);
                          String mime = f.getString(MediaFormat.KEY_MIME);
                          if (mime != null && mime.startsWith("audio/")) {
                              audioTrackIndex = i;
                              format = f;
                              mimeType = mime.toLowerCase();
                              break;
                          }
                      }
                      if (audioTrackIndex == -1 || format == null) return false;
                      extractor.selectTrack(audioTrackIndex);
                      File outFile = new File(outputPath);
                      if (outFile.exists()) outFile.delete();

                      int outFormat = MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4;
                      if ((mimeType.contains("opus") || outputPath.toLowerCase().endsWith(".webm") || outputPath.toLowerCase().endsWith(".ogg")) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          outFormat = MediaMuxer.OutputFormat.MUXER_OUTPUT_WEBM;
                      }
                      muxer = new MediaMuxer(outputPath, outFormat);
                      int muxTrack = muxer.addTrack(format);
                      muxer.start();

                      int maxBufferSize = 512 * 1024;
                      if (format.containsKey(MediaFormat.KEY_MAX_INPUT_SIZE)) {
                          int s = format.getInteger(MediaFormat.KEY_MAX_INPUT_SIZE);
                          if (s > maxBufferSize) maxBufferSize = s;
                      }
                      ByteBuffer buffer = ByteBuffer.allocateDirect(maxBufferSize);
                      MediaCodec.BufferInfo bufferInfo = new MediaCodec.BufferInfo();
                      long firstSampleTimeUs = -1;
                      long lastAudioPts = -1;
                      int sampleCount = 0;

                      while (true) {
                          bufferInfo.offset = 0;
                          bufferInfo.size = extractor.readSampleData(buffer, 0);
                          if (bufferInfo.size < 0) break;
                          long rawPts = extractor.getSampleTime();
                          if (firstSampleTimeUs == -1) firstSampleTimeUs = rawPts >= 0 ? rawPts : 0;
                          long pts = rawPts - firstSampleTimeUs;
                          if (pts < 0) pts = 0;
                          if (pts <= lastAudioPts) pts = lastAudioPts + 1000;
                          lastAudioPts = pts;
                          bufferInfo.presentationTimeUs = pts;
                          bufferInfo.flags = extractor.getSampleFlags();
                          muxer.writeSampleData(muxTrack, buffer, bufferInfo);
                          sampleCount++;
                          extractor.advance();
                      }
                      if (sampleCount == 0) return false;
                      muxer.stop();
                      muxer.release();
                      muxer = null;
                      File finalFile = new File(outputPath);
                      return finalFile.exists() && finalFile.length() > 0;
                  } catch (Exception e) {
                      Log.e(TAG, "extractNativeAudio error: " + e.getMessage(), e);
                      return false;
                  } finally {
                      try { extractor.release(); } catch (Exception ignored) {}
                      if (muxer != null) {
                          try { muxer.release(); } catch (Exception ignored) {}
                      }
                  }
              }
          }
          """
          with open(os.path.join(dir_path, "MainActivity.java"), "w") as f:
              f.write(java_code)
          '
          find android/app/src/main -name "MainActivity.kt" -exec rm -f {} +
      - name: Apply Gradle and Android Build Fixes
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "com\.android\.application" version "[0-9.]+"/id "com.android.application" version "7.4.2"/g' android/settings.gradle || true
            sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E "s/ext\.kotlin_version\s*=\s*'[^']+'/ext.kotlin_version = '2.0.21'/g" android/build.gradle || true
            sed -i -E "s/kotlin-gradle-plugin:[0-9.]+/kotlin-gradle-plugin:2.0.21/g" android/build.gradle || true
            sed -i -E "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:7.4.2/g" android/build.gradle || true
          fi
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E 's/gradle-[0-9.]+-all\.zip/gradle-7.6.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion\s+flutter\.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*[0-9]+/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/compileSdk\s*=\s*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+[0-9]+/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
            sed -i -E 's/minifyEnabled\s+true/minifyEnabled false/g' android/app/build.gradle || true
            sed -i -E 's/shrinkResources\s+true/shrinkResources false/g' android/app/build.gradle || true
            echo 'tasks.whenTaskAdded { task -> if (task.name.toLowerCase().contains("aarmetadata")) { task.enabled = false } }' >> android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 24/g' android/app/build.gradle.kts || true
            sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          fi
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class io.flutter.app.** { *; }
          -keep class io.flutter.plugin.**  { *; }
          -keep class io.flutter.util.**  { *; }
          -keep class io.flutter.view.**  { *; }
          -keep class io.flutter.**  { *; }
          -keep class io.flutter.plugins.**  { *; }
          -dontwarn io.flutter.embedding.**
          -keep class io.flutter.plugins.GeneratedPluginRegistrant { *; }
          -keep class * implements io.flutter.embedding.engine.plugins.FlutterPlugin { *; }
          -keep class * implements io.flutter.plugin.common.PluginRegistry$PluginRegistrantCallback { *; }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.6.0"
          RELEASE_TITLE="Boykta Pro v1.6.0 - التحديث الشامل: استقبال المشاركة، تعزيز جودة الريلز والستوريات، والمشغل العائم"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          NOTES="🚀 **Boykta Pro v1.6.0** - التحديث الشامل لمستوى احترافي غير مسبوق في تنزيل الوسائط!

          ### ✨ أبرز ما في هذا التحديث:
          - 📲 **استقبال الروابط من قائمة المشاركة (System Share Sheet):** يمكنك الآن الضغط على زر 'مشاركة' (Share) في أي تطبيق (يوتيوب، تيك توك، إنستغرام، فيسبوك، X، المتصفح) واختيار Boykta Pro ليفتح التطبيق ويبدأ فحص وتنزيل الفيديو فوراً دون نسخ ولصق يدوي.
          - 🪟 **مشغل منبثق عائم تلقائي عند الخروج (Auto Floating PiP):** استمرار مشاهدة الفيديو في نافذة عائمة متجاوبة فور الخروج من التطبيق أو الضغط على زر الرئيسية (Home).
          - ✨ **تقنية تعزيز الجودة والنقاء (AI / Ultra Quality Boost):** سحب الفيديوهات والريلز والستوريات بأعلى Bitrate ممكن وبدون ضغط خوارزمي، مع استخراج الصوت بنقاء كريستالي 320kbps.
          - 🔔 **نظام إشعارات مطور وفوري:** تنبيهات مكتملة بالصوت والاهتزاز فور انتهاء التنزيل وتأكيد إضافة الملف لاستوديو ومعرض صور الهاتف، مع تنبيهات توضيحية في حال تعذر الاتصال.
          - 🔁 **استئناف ذكي وتكرار آلي (Smart Resume & Retry):** تجزئة التنزيل لقطع متتالية مع 8 محاولات آلية ذكية لمعالجة انقطاع الشبكة بدون فقدان ما تم تحميله.
          - 📸 **دعم ألبومات صور تيك توك الفائقة النقاء (Photo Slideshows):** تحميل كافة صور سلاسل تيك توك الأصلية بأعلى نقاء.
          - ⚡ **تطبيق خفيف فائق السرعة وبدون أي إعلانات:** مبني ليعمل على كافة معالجات وهواتف أندرويد (Universal APK).

          📲 **التثبيت المباشر:** قم بتحميل ملف \`app-release.apk\` المرفق أدناه وتثبيته مباشرة على هاتفك الأندرويد."

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber || true
          else
            gh release create "$TAG" "$APK_PATH" --title "$RELEASE_TITLE" --notes "$NOTES"
          fi
